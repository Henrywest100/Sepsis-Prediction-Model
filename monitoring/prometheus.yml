global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "elvara-sepsis-ser"
    scheme: "http"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["sepsis-prediction-model.railway.internal:8002"]