global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "elvara-sepsis-ser"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["elvara-api:8002"]  # ← Use container name