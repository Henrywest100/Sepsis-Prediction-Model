services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: elvara-api
    ports:
      - "8002:8002"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../monitoring/reports:/app/monitoring/reports
    environment:
      - MODEL_PATH=models/sepsis_model.joblib
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus
    container_name: elvara-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: elvara-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data: